# Las dependencias envejecen solas; las auditorias del CI solo avisan de lo que
# ya salio publicado. Esto abre el pull request sin que nadie se acuerde.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Los motores de render se agrupan: suben juntos y se prueban juntos,
      # porque una prueba de integracion dibuja los 64 tipos con todos ellos.
      motores:
        patterns:
          - '@terrastruct/d2'
          - '@hpcc-js/wasm-graphviz'
          - mermaid
          - bpmn-js
          - likec4
          - vega
          - vega-lite
          - svgbob-wasm
          - puppeteer-core
      desarrollo:
        dependency-type: development

    # Dos mayores que se rechazan a proposito, no por pereza. Se revisa cuando
    # cambie el motivo, no cuando Dependabot insista.
    ignore:
      # Commander 15 exige Node >=22.12.0 y nosotros declaramos >=22.0.0.
      # Subir el minimo es un cambio incompatible para quien instala, y a
      # cambio no se gana nada: la unica novedad que nos tocaria —el cambio en
      # los valores por defecto de las opciones `--no-*`— no nos afecta,
      # porque `--no-cache` no tiene contraparte positiva. Se tomara cuando
      # haya otro motivo para subir el suelo de Node.
      - dependency-name: commander
        update-types: ['version-update:semver-major']
      # TypeScript 7 todavia no lo acepta `typescript-eslint` como peer: `npm
      # ci` falla antes de compilar nada. Se toma cuando el lint lo soporte.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
