# Las dependencias envejecen solas; las auditorias del CI solo avisan de lo que
# ya salio publicado. Esto abre el pull request sin que nadie se acuerde.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Los motores de render se agrupan: suben juntos y se prueban juntos,
      # porque una prueba de integracion dibuja los 64 tipos con todos ellos.
      motores:
        patterns:
          - '@terrastruct/d2'
          - '@hpcc-js/wasm-graphviz'
          - mermaid
          - bpmn-js
          - likec4
          - vega
          - vega-lite
          - svgbob-wasm
          - puppeteer-core
      desarrollo:
        dependency-type: development

    # Lo que se rechaza a proposito, no por pereza. Se revisa cuando cambie el
    # motivo, no cuando Dependabot insista.
    ignore:
      # TypeScript 7 todavia no lo acepta `typescript-eslint` como peer: `npm
      # ci` falla antes de compilar nada. Se toma cuando el lint lo soporte.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
      # `@types/node` tiene que seguir al Node MINIMO que declara `engines`,
      # no al ultimo publicado: con los tipos de un Node mas nuevo, el
      # compilador acepta APIs que no existen en el suelo que prometemos y el
      # fallo aparece en la maquina de quien instala. Sube cuando suba
      # `engines.node`, y entonces a mano.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
