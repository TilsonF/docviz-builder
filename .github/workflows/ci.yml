name: CI

# Las compuertas del proyecto —documentacion al dia, umbral de cobertura, los 57
# tipos dibujandose de verdad— solo sirven si se ejecutan siempre. Aqui es donde
# dejan de depender de que alguien se acuerde.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # La compuerta completa —documentacion, cobertura, los 57 tipos dibujados de
  # verdad y el renderizado en GitHub— solo tiene sentido ejecutarla una vez.
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # PlantUML necesita una JVM. El resto de motores van embebidos.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Instalar dependencias
        run: npm ci

      # El jar pesa 27 MB y no se versiona: se descarga una vez y se cachea por
      # version, de modo que solo se vuelve a bajar al subirla.
      - name: Cachear plantuml.jar
        uses: actions/cache@v4
        with:
          path: vendor
          key: plantuml-${{ hashFiles('scripts/fetch-plantuml.mjs') }}

      - name: Descargar PlantUML
        run: npm run setup

      # Mermaid y BPMN dibujan dentro de un Chromium. DocViz no descarga
      # navegadores: se le proporciona uno y lo encuentra en la cache.
      - name: Cachear Chromium
        id: cache-chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Instalar Chromium
        if: steps.cache-chromium.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      # Un build en frio son 33 segundos dibujando; con cache, medio. Se guarda
      # por contenido de los documentos y del codigo que los compila.
      - name: Cachear los recursos generados
        uses: actions/cache@v4
        with:
          path: .docviz-cache
          key: docviz-${{ hashFiles('src/**/*.ts', 'examples/**/*.md', 'docs-src/**/*.md') }}
          restore-keys: docviz-

      # El arbol de produccion es lo que viaja dentro del paquete: una
      # vulnerabilidad ahi la hereda todo el que lo instale, aunque el codigo
      # afectado no este en ningun camino que DocViz ejecute.
      # `npm audit` crudo es todo o nada. Cuando aparece un aviso SIN correccion
      # publicada, las salidas eran bajar el nivel —que esconde tambien los que
      # si se pueden arreglar— o quitar el paso. Esto permite aceptar uno
      # concreto, con su motivo escrito y una fecha de revision que caduca.
      - name: Auditar dependencias de produccion
        run: npm run auditoria

      # Las de desarrollo se reportan y no bloquean: no salen de este repositorio.
      - name: Auditar dependencias de desarrollo
        run: npm audit --audit-level=moderate || true

      - name: Compilar
        run: npm run build

      - name: Comprobar tipos
        run: npm run typecheck

      # Lo que el compilador no ve: una promesa sin esperar, un `String()`
      # sobre algo que podria ser un objeto, un `catch` que pierde la causa.
      - name: Lint
        run: npm run lint

      # Falla si la documentacion quedo desfasada del catalogo de tipos.
      - name: Comprobar la documentacion
        run: npm run docs:check

      # Incluye las pruebas que dibujan los 57 tipos con su motor real.
      - name: Pruebas y cobertura
        run: npm run test:coverage

      # Mide si el catalogo guia bien la eleccion de tipo. No usa ningun modelo
      # ni la red: es la parte determinista del eval, y sirve de compuerta
      # contra regresiones al tocar keywords o descripciones.
      - name: Eval del catalogo
        run: npm run eval -- --minimo 0.85

      - name: Compilar la documentacion del proyecto
        run: npm run docs:build

      - name: Verificar que no haya imagenes rotas
        run: npm run docs:verify

      # Dibuja el catalogo completo: es la prueba manual convertida en automatica.
      - name: Compilar el catalogo
        run: npm run showcase

      - name: Verificar el catalogo
        run: node bin/docviz.mjs verify artifacts/showcase

      # Pide a GitHub que renderice el resultado con su propia API.
      - name: Comprobar el renderizado en GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: npm run check:github

      - name: Publicar los resultados
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: resultados
          path: |
            coverage/
            artifacts/showcase/
          retention-days: 14

  # Windows y macOS no comprueban el catalogo entero: comprueban lo unico que
  # de verdad cambia entre sistemas —donde estan Java y Chromium, como se
  # resuelven las rutas y si el jar se descarga y se verifica—. Con eso basta
  # para que un `npm install` en otro sistema deje de ser un acto de fe.
  otros-sistemas:
    # Informativo mientras se caracteriza: la primera ejecucion encontro un
    # bloqueo en macOS que no se reproduce en local —la misma prueba tarda
    # menos de un segundo aqui y agota los 180 s alli— y hasta saber por que,
    # bloquear cada PR con eso costaria mas de lo que avisa.
    continue-on-error: true

    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
        # Node 20 llego a fin de vida el 24 de marzo de 2026. Ademas no carga
        # modulos WASM por ESM sin bandera, asi que `svgbob` no funcionaba alli
        # —y la matriz lo descubrio—. Mantenerlo en la matriz habria sido
        # prometer un soporte que no existia.
        node: ['22']

    runs-on: ${{ matrix.os }}
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # --- Diagnostico del cuelgue de macOS -------------------------------
      #
      # El job de macOS muere con «The runner has received a shutdown signal»
      # SIN que falle ninguna prueba: las que ya corrieron salen en verde y el
      # runner desaparece a los ocho minutos. Es un fallo conocido de GitHub
      # que se reporta desde 2022, y la causa que mas se repite es quedarse
      # sin disco.
      #
      # Encaja con este job: instala ~400 MB de `node_modules` y descarga un
      # jar de 27 MB, y los runners de macOS tienen menos disco que los de
      # Linux. Asi que antes de tocar nada se mide, que es mas barato que
      # suponer. Si el disco resulta no ser la causa, estos numeros tambien lo
      # descartan y toca mirar la memoria o pedir el log de depuracion.
      - name: Espacio y memoria antes de instalar
        if: runner.os != 'Windows'
        run: |
          echo "── disco ──"; df -h /
          echo "── memoria ──"
          if [ "$RUNNER_OS" = "macOS" ]; then
            vm_stat | head -6
            sysctl -n hw.memsize | awk '{printf "  RAM total: %.1f GB\n", $1/1073741824}'
          else
            free -h
          fi

      - run: npm ci

      # Comprueba de paso la verificacion del digest en otro sistema.
      - run: npm run setup

      - name: Espacio despues de instalar y descargar el jar
        if: runner.os != 'Windows'
        run: |
          df -h /
          du -sh node_modules vendor 2>/dev/null || true

      - run: npm run build
      - run: npm run typecheck

      # Las pruebas unitarias incluyen las que dibujan con PlantUML y con los
      # motores WebAssembly. Mermaid y BPMN se omiten solos si no hay navegador.
      - run: npm run test:unit

      # `always()` para que se ejecute aunque las pruebas fallen. Si el runner
      # muere de golpe tampoco correra: eso tambien es informacion.
      - name: Espacio al terminar
        if: always() && runner.os != 'Windows'
        run: df -h /

      - name: Comprobar que la CLI arranca y ve su entorno
        run: node bin/docviz.mjs doctor
