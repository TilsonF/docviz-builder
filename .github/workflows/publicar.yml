name: Publicar

# Publica el paquete en npm al etiquetar una version.
#
#   git tag v0.2.0 && git push origin v0.2.0
#
# El registro es npmjs publico y no GitHub Packages a proposito: el objetivo es
# que cualquiera —y cualquier agente— pueda hacer `npx docviz` sin autenticarse.
# GitHub Packages exige un token hasta para leer, que es justo la friccion que
# hace que una herramienta no se use.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# Dos corridas del mismo tag se pisaron al publicar 0.3.0: una firmo y subio, la
# otra murio con «E409 Cannot publish over previously staged version». El paquete
# quedo bien, pero el tablero decia «failure» sobre una version que SI estaba
# publicada, que es la peor forma de equivocarse. Se serializan por etiqueta.
concurrency:
  group: publicar-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  # Firma de procedencia: npm registra desde que commit y que workflow salio
  # cada version publicada.
  id-token: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          registry-url: https://registry.npmjs.org

      # Las pruebas dibujan con PlantUML de verdad, asi que este job necesita el
      # mismo entorno que el de CI. Sin la JVM y sin el jar no fallan por un
      # error del codigo: fallan por no tener con que dibujar, que es peor,
      # porque parece lo mismo.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cachear plantuml.jar
        uses: actions/cache@v4
        with:
          path: vendor
          key: plantuml-${{ hashFiles('scripts/fetch-plantuml.mjs') }}

      - run: npm ci
      - run: npm run setup

      # No se publica algo que no compila ni pasa sus propias comprobaciones.
      - run: npm run build
      - run: npm run typecheck
      - run: npm run test:unit

      - name: Comprobar que la etiqueta coincide con la version del paquete
        run: |
          etiqueta="${GITHUB_REF_NAME#v}"
          paquete="$(node -p "require('./package.json').version")"
          if [ "$etiqueta" != "$paquete" ]; then
            echo "la etiqueta ($etiqueta) no coincide con la version del paquete ($paquete)" >&2
            exit 1
          fi

      # Serializadas ya no compiten, pero la segunda seguiria intentando publicar una
      # version que la primera acaba de subir. Publicar es idempotente: si el registro
      # ya tiene esta version, no hay nada que hacer y no es un fallo.
      - name: Comprobar si la version ya esta publicada
        id: publicada
        run: |
          paquete="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          if npm view "$paquete@$version" version >/dev/null 2>&1; then
            echo "$paquete@$version ya esta en el registro; no se republica"
            echo "existe=si" >> "$GITHUB_OUTPUT"
          else
            echo "existe=no" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.publicada.outputs.existe == 'no'
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
